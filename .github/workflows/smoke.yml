name: Public endpoint smoke checks
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/smoke.yml
      - src/worker.mjs
      - src/mcp.mjs
      - src/operator.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify HTTPS, index resources and read-only MCP handshake
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const base='https://open-address.org';
          for(const path of ['/','/trust','/changelog','/robots.txt','/sitemap.xml','/capabilities.json','/.well-known/security.txt']){
            const r=await fetch(base+path,{signal:AbortSignal.timeout(10000)});
            if(r.status!==200)throw Error(path+' HTTP '+r.status);
            console.log(path+' HTTP 200');
          }
          const resp=await fetch(base+'/mcp',{
            method:'POST',signal:AbortSignal.timeout(10000),
            headers:{'Content-Type':'application/json','Accept':'application/json, text/event-stream','MCP-Protocol-Version':'2026-07-28','Mcp-Method':'tools/list'},
            body:JSON.stringify({jsonrpc:'2.0',id:1,method:'tools/list',params:{_meta:{'io.modelcontextprotocol/protocolVersion':'2026-07-28'}}})
          });
          if(resp.status!==200)throw Error('MCP tools/list HTTP '+resp.status);
          const payload=await resp.json();
          if(!payload.result?.tools?.some(t=>t.name==='submit_inquiry'))throw Error('MCP tools missing');
          console.log('MCP read-only handshake passed');
          JS