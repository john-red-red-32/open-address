name: Notify IndexNow of updated publications
on:
  push:
    branches: [main]
    paths:
      - src/worker.mjs
      - src/journal.mjs
      - .github/workflows/indexnow.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate hosted IndexNow key and submit published URLs
        shell: bash
        run: |
          set -euo pipefail
          KEY="$(cat indexnow-key.txt)"
          curl --fail --silent --show-error --max-time 20 "https://open-address.org/${KEY}.txt" | grep -Fx "$KEY"
          # URL list is generated from the live, canonical sitemap; private endpoints are absent.
          curl --fail --silent --show-error --max-time 20 'https://open-address.org/sitemap.xml' -o sitemap.xml
          node --input-type=module -e '
            import fs from "node:fs";
            const xml=fs.readFileSync("sitemap.xml","utf8");
            const list=[...xml.matchAll(/<loc>(https:\/\/open-address\.org\/[^<]+)<\/loc>/g)].map(m=>m[1]);
            if(!list.length || list.length>1000)process.exit(1);
            fs.writeFileSync("payload.json",JSON.stringify({host:"open-address.org",key:fs.readFileSync("indexnow-key.txt","utf8").trim(),urlList:list}));
          ' 
          curl --fail --silent --show-error --max-time 30 -H 'Content-Type: application/json' \
            --data-binary @payload.json https://api.indexnow.org/indexnow